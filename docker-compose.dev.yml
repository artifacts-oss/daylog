# Dev infra only (Postgres + Redis). Run the app on the host with `npm run dev`.
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16
    container_name: daylog-dev-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daylog}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - dev-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: daylog-dev-redis
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - dev-redis:/data

volumes:
  dev-data:
  dev-redis:
